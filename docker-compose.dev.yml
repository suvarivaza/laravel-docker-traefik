services:
  php:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "${PHP_PORT:-81}:8080"
    environment:
      - "PHP_DISPLAY_ERRORS=on"
      - "PHP_OPCACHE_ENABLE=0"
  node:
    image: node:22-alpine
    restart: always
    tty: true
    ports:
      - "5173:5173"
    volumes:
      - "${APP_PATH:?Set APP_PATH in .env}:/var/www"
    working_dir: /var/www
    networks:
      - net
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

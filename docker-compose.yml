services:
    php:
        build:
            context: ./php
            dockerfile: Dockerfile
            target: production
            args:
                PHP_VERSION: ${PHP_VERSION:-8.2}
        restart: always
        tty: true
        environment:
            #https://serversideup.net/open-source/docker-php/docs/reference/environment-variable-specification
            - "SSL_MODE=off"
            - "AUTORUN_ENABLED=false"
            - "PHP_MEMORY_LIMIT=512M"
            - "PHP_POST_MAX_SIZE=50M"
            - "PHP_UPLOAD_MAX_FILE_SIZE=50M"
            - "PHP_MAX_EXECUTION_TIME=60"
            - "PHP_OPCACHE_ENABLE=1"
            - "APP_WEBROOT=/var/www/html/public"
        volumes:
            - "${APP_PATH:?Set APP_PATH in .env}:/var/www/html"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - net
    mysql:
        image: mysql:8.0
        restart: always
        tty: true
        environment:
            - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
            - "MYSQL_USER=${DB_USERNAME:?Set DB_USERNAME in .env}"
            - "MYSQL_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}"
            - "MYSQL_DATABASE=${DB_DATABASE:?Set DB_DATABASE in .env}"
        volumes:
            - database:/var/lib/mysql
        networks:
            - net
        healthcheck:
            test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 --silent']
            interval: 10s
            start_period: 30s
            retries: 5
            timeout: 5s
    phpmyadmin:
        profiles: [tools]
        image: phpmyadmin
        restart: always
        environment:
            - "PMA_HOST=mysql"
            - "UPLOAD_LIMIT=64M"
        ports:
            - "127.0.0.1:${PMA_PORT:-8080}:80"
        depends_on:
            - mysql
        networks:
            - net
    redis:
        image: 'redis:alpine'
        restart: always
        volumes:
            - 'redis:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        networks:
            - net
volumes:
    database:
        driver: local
    redis:
        driver: local
networks:
    net:
        driver: bridge

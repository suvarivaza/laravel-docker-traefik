services:
  traefik:
    image: "traefik:v3.0"
    restart: always
    command:
      - "--log.level=INFO"
      - "--providers.docker=true" # Enabling Docker provider
      - "--providers.docker.exposedbydefault=false" # Do not expose containers unless explicitly told so
      ## entryPoints
      - "--entryPoints.http.address=:80" # Traefik will listen to incoming request on the port 80 (HTTP)
      - "--entrypoints.https.address=:443" # Traefik will listen to incoming request on the port 443 (HTTPS)
      ## redirections
      - "--entrypoints.http.http.redirections.entrypoint.to=https"
      - "--entrypoints.http.http.redirections.entrypoint.scheme=https"
      ## Let'sEncrypt - https://doc.traefik.io/traefik/https/acme/
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${TRAEFIK_EMAIL:?Set TRAEFIK_EMAIL in .env}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    #      - "--certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    ports:
      - "80:80" # HTTP port
      - "443:443" # HTTPS port
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" # So that Traefik can listen to the Docker events
      - "letsencrypt:/letsencrypt"
    networks:
      - net
  php:
    labels:
      - "traefik.enable=true" # Explicitly tell Traefik to expose this container
      - "traefik.http.services.php.loadbalancer.server.port=8080"
      - "traefik.http.routers.php.rule=Host(`${TRAEFIK_APP_URL:?Set TRAEFIK_APP_URL in .env}`)" # The domain the service will respond to
      - "traefik.http.routers.php.entrypoints=https" # Allow request only from the predefined entry point named "http"
      - "traefik.http.routers.php.tls.certresolver=le"
volumes:
  letsencrypt:
    driver: local
networks:
  net:
    driver: bridge
